# render.yaml - Render Blueprint Configuration
# Deploy with 1-click on https://render.com

services:
  - type: web
    name: ai-research-gap-finder
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_app.py
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false # Set your Groq API key securely in the Render Dashboard
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: ANONYMIZED_TELEMETRY
        value: "False"
      - key: HF_HUB_DISABLE_TELEMETRY
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
